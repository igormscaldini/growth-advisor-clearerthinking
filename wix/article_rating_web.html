<!--
  Article rating box for Wix blog posts (paste into the post's "HTML code" embed, height ~190px).
  Same GT program as the newsletter box (38551, 8uevt6x); the extra `source=website` URL param
  becomes its own column in the GT export, so web ratings can be told apart from newsletter ones
  (newsletter runs have it blank). Replace ARTICLE_URL (5 places) with the post's plain URL,
  e.g. https://www.clearerthinking.org/post/the-supplement-paradox. Links open a new tab because
  a Wix HTML embed is an iframe.
-->
<div style="text-align:center; margin:0; padding:0; background:transparent;">
  <div style="font-family:Arial, Helvetica, sans-serif; font-size:22px; font-weight:bold; color:#111827; padding:16px 0 8px;">
    Help us improve by rating this article
  </div>
  <div style="font-family:Arial, Helvetica, sans-serif; font-size:16px; color:#374151; padding:0 0 16px;">
    Please click one emoji below to tell us how good or bad you felt this article was.
  </div>
  <table align="center" border="0" cellpadding="8" cellspacing="0" style="margin:0 auto; text-align:center;">
    <tbody>
      <tr>

          <div style="font-size:12px; color:#6b7280; margin-top:4px;">Bad</div>
        </td>
        <td align="center" style="font-family:Arial, Helvetica, sans-serif;">
