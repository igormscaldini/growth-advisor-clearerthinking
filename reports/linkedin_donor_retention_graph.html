<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  .card {
    width: 1200px;
    height: 1200px;
    box-sizing: border-box;
    background: #fcfcfb;
    color: #0b0b0b;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 60px 64px 48px 64px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .title { font-size: 46px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.1; }
  .subtitle { font-size: 24px; color: #52514e; margin-top: 12px; }
  .legend { margin-top: 30px; display: flex; flex-direction: column; gap: 12px; }
  .legend-row { display: flex; align-items: center; gap: 14px; font-size: 24px; color: #0b0b0b; }
  .swatch { width: 16px; height: 16px; border-radius: 50%; flex: none; }
  .legend-row b { font-weight: 600; }
  .foot { font-size: 19px; color: #898781; margin-top: 10px; }
  svg { display: block; margin-top: 26px; }
  svg text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .tick { font-size: 20px; fill: #898781; }
  .axis-caption { font-size: 21px; fill: #898781; }
  .end-label { font-size: 25px; font-weight: 600; fill: #0b0b0b; }
  .annot { font-size: 22px; fill: #52514e; }
</style>
<div class="card">
  <div class="title">The $100 donor beats the $200 donor</div>
  <div class="subtitle">Cumulative donations per donor, simulated over 24 months</div>
  <div class="legend">
    <div class="legend-row"><span class="swatch" style="background:#2a78d6"></span><span><b>Org A</b> &middot; donors give $200/month &middot; stay 6 months</span></div>
    <div class="legend-row"><span class="swatch" style="background:#eb6834"></span><span><b>Org B</b> &middot; donors give $100/month &middot; stay 14 months</span></div>
  </div>
  <svg width="1072" height="780" viewBox="0 0 1072 780">
    <!-- baseline -->
    <line x1="90" y1="690" x2="1032" y2="690" stroke="#c3c2b7" stroke-width="1"/>
    <!-- y tick labels -->
    <text class="tick" x="76" y="696" text-anchor="end">$0</text>
    <text class="tick" x="76" y="531" text-anchor="end">$400</text>
    <text class="tick" x="76" y="366" text-anchor="end">$800</text>
    <text class="tick" x="76" y="201" text-anchor="end">$1,200</text>
    <text class="tick" x="76" y="36" text-anchor="end">$1,600</text>
    <!-- x tick labels -->
    <text class="tick" x="90" y="722" text-anchor="middle">0</text>
    <text class="tick" x="207.75" y="722" text-anchor="middle">3</text>
    <text class="tick" x="325.5" y="722" text-anchor="middle">6</text>
    <text class="tick" x="443.25" y="722" text-anchor="middle">9</text>
    <text class="tick" x="561" y="722" text-anchor="middle">12</text>
    <text class="tick" x="678.75" y="722" text-anchor="middle">15</text>
    <text class="tick" x="796.5" y="722" text-anchor="middle">18</text>
    <text class="tick" x="914.25" y="722" text-anchor="middle">21</text>
    <text class="tick" x="1032" y="722" text-anchor="middle">24</text>
    <text class="axis-caption" x="561" y="758" text-anchor="middle">Months since a donor starts giving</text>
    <!-- series lines -->
    <path d="M 90 690 L 325.5 195 L 1032 195" fill="none" stroke="#2a78d6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 90 690 L 639.5 112.5 L 1032 112.5" fill="none" stroke="#eb6834" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- crossover annotation -->
    <line x1="545" y1="160" x2="558" y2="186" stroke="#898781" stroke-width="1"/>
    <text class="annot" x="537" y="154" text-anchor="end">Month 12: B catches up</text>
    <circle cx="561" cy="195" r="6" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="2"/>
    <!-- end markers with surface rings -->
    <circle cx="1032" cy="195" r="9" fill="#fcfcfb"/>
    <circle cx="1032" cy="195" r="7" fill="#2a78d6"/>
    <circle cx="1032" cy="112.5" r="9" fill="#fcfcfb"/>
    <circle cx="1032" cy="112.5" r="7" fill="#eb6834"/>
    <!-- direct end labels -->
    <text class="end-label" x="1032" y="240" text-anchor="end">Org A: $1,200</text>
    <text class="end-label" x="1032" y="88" text-anchor="end">Org B: $1,400</text>
  </svg>
  <div class="foot">Donor lifetime: how many months the average donor keeps giving before lapsing.</div>
</div>
