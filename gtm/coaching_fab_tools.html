<!--
  "Get Coaching" floating button for the tool pages (programs.clearerthinking.org).

  Where it runs: GTM container GTM-WGXZSLV, Custom HTML tag "Get Coaching FAB - tools",
  trigger "All Pages" with the condition Page Hostname equals programs.clearerthinking.org.
  The same container also runs on www.clearerthinking.org, where the Wix custom embed
  "Get Coaching Button" already shows this button; the hostname condition plus the
  hostname guard below keep the two from ever showing together.

  Source of truth for the tag body: this file. Paste it whole into the GTM tag.
  Mirrors the Wix embed's markup and styles; the additions are the guards and the
  GuidedTrack-specific spacing (see comments in the script).
-->
<style>
  .ct-coaching-fab {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 1040; /* above GuidedTrack's fixed bars (max 1000), below Bootstrap modals (1050) */
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 22px;
    background-color: #0885F8;
    color: #ffffff !important;
    font-family: "Avenir Next", "Avenir", "Nunito Sans", "Segoe UI",
                 Helvetica, Arial, sans-serif;
    font-size: 16px;
    font-weight: 600;
    line-height: 1;
    text-decoration: none !important;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(8, 133, 248, 0.35);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease,
                background-color 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .ct-coaching-fab:hover {
    background-color: #0a76d8;
    color: #ffffff !important;
    text-decoration: none !important;
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(8, 133, 248, 0.45);
  }
  .ct-coaching-fab:active {
    transform: translateY(0);
    box-shadow: 0 4px 12px rgba(8, 133, 248, 0.35);
  }
  .ct-coaching-fab svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }
  @media (max-width: 480px) {
    .ct-coaching-fab {
      bottom: 16px;
      right: 16px;
      padding: 12px 18px;
      font-size: 15px;
    }
  }
  /* Phones: GuidedTrack pins a 48px navigation bar to the bottom when a program
     declares *navigation; the button then sits above that bar. */
  .ct-coaching-fab.ct-coaching-fab--lift {
    bottom: 64px;
  }
  /* Let the last line of every program page scroll clear of the button. */
  html.ct-coaching-fab-on .program_container .main {
    padding-bottom: 88px !important;
  }
  html.ct-coaching-fab-on.ct-coaching-fab-lift .program_container .main {
    padding-bottom: 136px !important;
  }
</style>
<script>
(function () {
  try {
    // Only the top-level document: a tool page framed inside the Wix site already has the Wix button.
    if (window.self !== window.top) return;
    // Belt and braces with the GTM trigger condition.
    if (location.hostname !== 'programs.clearerthinking.org') return;
    if (document.querySelector('.ct-coaching-fab')) return;

    // Path prefixes (lower-case) where the button must not appear. Empty = every page.
    var HIDE_ON = [];
    var path = location.pathname.toLowerCase();
    for (var i = 0; i < HIDE_ON.length; i++) {
      if (path.indexOf(HIDE_ON[i]) === 0) return;
    }

    var fab = document.createElement('a');
    fab.className = 'ct-coaching-fab';
    // utm parameters (Igor's choice, 2026-10-21), matching the Wix "Get Coaching Button":
    // the /coaching visit is then attributed in GA4 to tools / banner, which starts a new
    // session and replaces the visitor's original source for that visit.
    fab.href = 'https://www.clearerthinking.org/coaching'
      + '?utm_source=tools&utm_medium=banner&utm_campaign=tools_floating_button';
    fab.setAttribute('aria-label', 'Get Coaching');
    fab.innerHTML =
      '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
      '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7' +
      'a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" ' +
      'stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      'Get Coaching';
    fab.addEventListener('click', function () {
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({
        event: 'coaching_fab_click',
        link_url: fab.href,
        link_text: 'Get Coaching'
      });
    });

    // Function expressions, not declarations: GTM's Custom HTML compiler is ES5-only and
    // rejects a function declaration inside a block (here, the try block).
    var update = function () {
      if (!document.body) return;
      // GuidedTrack re-renders only its .main div, but some landing pages rebuild <body>
      // when the program starts (personality-test.html does): put the button back if so.
      if (!document.body.contains(fab)) document.body.appendChild(fab);
      document.documentElement.classList.add('ct-coaching-fab-on');
      var hasBottomNav = !!document.querySelector('.program_container .navigation_container li');
      var lift = hasBottomNav && window.innerWidth < 768;
      fab.classList.toggle('ct-coaching-fab--lift', lift);
      document.documentElement.classList.toggle('ct-coaching-fab-lift', lift);
      // GuidedTrack's native payment panel is also fixed to the bottom; hide while it is open.
      fab.style.display = document.getElementById('payment-ui-container') ? 'none' : '';
    };

    var pending = false;
    var schedule = function () {
      if (pending) return;
      pending = true;
      requestAnimationFrame(function () { pending = false; update(); });
    };
    update();
    new MutationObserver(schedule).observe(document.documentElement, { childList: true, subtree: true });
    window.addEventListener('resize', schedule);
  } catch (e) {
    // Never let the button break a program.
  }
})();
</script>
