<style>
  .ct-coaching-fab {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 2147483000; /* sit above Wix UI */
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 22px;
    background-color: #0885F8;
    color: #ffffff !important;
    font-family: "Avenir Next", "Avenir", "Nunito Sans", "Segoe UI",
                 Helvetica, Arial, sans-serif;
    font-size: 16px;
    font-weight: 600;
    line-height: 1;
    text-decoration: none !important;
    border-radius: 999px; /* fully rounded pill */
    box-shadow: 0 6px 18px rgba(8, 133, 248, 0.35);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease,
                background-color 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .ct-coaching-fab:hover {
    background-color: #0a76d8;
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(8, 133, 248, 0.45);
  }
  .ct-coaching-fab:active {
    transform: translateY(0);
    box-shadow: 0 4px 12px rgba(8, 133, 248, 0.35);
  }
  .ct-coaching-fab svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }
  /* Slightly tighter on small screens */
  @media (max-width: 480px) {
    .ct-coaching-fab {
      bottom: 16px;
      right: 16px;
      padding: 12px 18px;
      font-size: 15px;
    }
  }
</style>

<a class="ct-coaching-fab"
   href="https://www.clearerthinking.org/coaching?utm_source=website&utm_medium=banner&utm_campaign=coaching_floating_button"
   aria-label="Get Coaching">
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"
          stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  Get Coaching
</a>

<script>
  (function () {
    // Hide the button on any /coaching page (e.g. /coaching, /coaching/plans).
    function applyVisibility() {
      var path = window.location.pathname.toLowerCase();
      var onCoaching = path === "/coaching" || path.indexOf("/coaching") === 0;
      var btn = document.querySelector(".ct-coaching-fab");
      if (!btn) return;

      btn.style.display = onCoaching ? "none" : "inline-flex";

      // On the tools page (desktop only), lift the button ~1 inch (96px) to
      // avoid overlapping another element. Default bottom is 24px elsewhere.
      var onToolsPage = path.indexOf("/clearer-thinking-tools") === 0;
      var isDesktop = window.matchMedia("(min-width: 1001px)").matches;
      btn.style.bottom = (onToolsPage && isDesktop) ? "120px" : "";
    }

    applyVisibility();

    // Re-check when the viewport crosses the desktop/mobile threshold.
    window.addEventListener("resize", applyVisibility);

    // Wix is a single-page app: re-check when the route changes without a reload.
    var lastPath = window.location.pathname;
    setInterval(function () {
      if (window.location.pathname !== lastPath) {
        lastPath = window.location.pathname;
        applyVisibility();
      }
    }, 400);
  })();
</script>
