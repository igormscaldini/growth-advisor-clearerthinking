<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share card: the astrology prize</title>
<!-- Source of og.png (the image social networks show for the page). Rebuild with build_og.py.
     The amount and the pass mark are read from logic.js, so the card cannot drift from the page. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  html, body { margin: 0; background: #777; }
  #canvas { position: relative; width: 1200px; height: 630px; overflow: hidden; color: #f6efe0;
    font-family: "Fraunces", Georgia, serif;
    background: radial-gradient(760px 560px at 86% 50%, #1c3449 0%, rgba(28, 52, 73, 0) 64%), #0b141c; }
  #canvas p { margin: 0; }
  .wheel { position: absolute; right: -150px; top: 50%; width: 640px; height: 640px; transform: translateY(-50%); color: rgba(246, 239, 224, 0.5); }
  .wheel svg { width: 100%; height: 100%; display: block; }
  .logo { position: absolute; left: 64px; top: 50px; width: 250px; }
  .kicker { position: absolute; left: 66px; top: 150px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 19px; letter-spacing: 0.17em; text-transform: uppercase; color: #ee8031; }
  .amount { position: absolute; left: 60px; top: 196px; font-weight: 620; font-size: 196px; line-height: 0.9; letter-spacing: -0.04em; font-variant-numeric: lining-nums; white-space: nowrap; }
  .amount .cur { font-size: 0.5em; vertical-align: 0.66em; margin-right: 0.05em; color: #ee8031; letter-spacing: 0; }
  .stamp { position: absolute; left: 606px; top: -34px; transform: rotate(-7deg); padding: 7px 15px 6px; border: 3px solid #ee8031; border-radius: 8px; background: rgba(11, 20, 28, 0.6); color: #ee8031; font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 21px; line-height: 1.2; letter-spacing: 0.24em; text-transform: uppercase; }
  .sub { position: absolute; left: 66px; top: 408px; width: 730px; font-weight: 420; font-size: 38px; line-height: 1.16; letter-spacing: -0.008em; }
  .sub em { font-style: italic; color: #ee8031; white-space: nowrap; }
  .foot { position: absolute; left: 66px; bottom: 46px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 19px; letter-spacing: 0.06em; color: rgba(246, 239, 224, 0.74); }
</style>
</head>
<body>
<div id="canvas">
  <div class="wheel" id="wheel"></div>
  <img class="logo" src="ct-logo-on-dark.svg" alt="ClearerThinking.org">
  <p class="kicker">The Clearer Thinking Astrology Prize</p>
  <p class="amount"><span class="cur">$</span><span id="amount"></span><span class="stamp">Unclaimed</span></p>
  <p class="sub">for the first astrologer who can match <em id="bar"></em> strangers to their birth charts.</p>
  <p class="foot" id="foot"></p>
</div>
<script src="logic.js"></script>
<script>
  (function () {
    var L = window.PrizeLogic, c = L.CONFIG, s = L.STUDY_2024;
    document.getElementById('wheel').innerHTML = L.wheelSVG(42);
    document.getElementById('amount').textContent = L.formatMoney(c.prize).slice(1);
    document.getElementById('bar').textContent = c.bar + ' of ' + c.questions;
    document.getElementById('foot').textContent = s.astrologers + ' astrologers tried in 2024. Best score: ' + s.bestScore + ' of ' + c.questions + '.';
  })();
</script>
</body>
</html>
