name: Weekly growth-advisor email

on:
  schedule:
    - cron: "0 11 * * 5"  # Fridays 11:00 UTC = 08:00 America/Sao_Paulo: the letter
    # Wednesdays: preflight. Tests every credential the letter depends on and emails only when
    # one is broken, leaving two days to fix it. Keep this string equal to PREFLIGHT_CRON below.
    - cron: "0 11 * * 3"
  workflow_dispatch:        # allow manual runs from the Actions UI
    inputs:
      preflight:
        description: "Only test the credentials (no letter is written or sent)"
        type: boolean
        default: false

# Before sending, this now refreshes frontend/public/snapshot.json (same as
# fetch-snapshot.yml) and pushes it if changed, so the dashboard linked in the email is
# current as of send time — hence contents:write.
permissions:
  contents: write

concurrency:
  group: weekly-advisor-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    # 15 min for the report itself + headroom for the snapshot refresh (fetch-snapshot.yml
    # budgets 25 min alone, mainly for beehiiv's cursor-paginated subscriber pass).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Claude Code CLI
        # Claude writes through headless Claude Code on Igor's subscription (no Anthropic API
        # credits). Needs the CLAUDE_CODE_OAUTH_TOKEN secret: `claude setup-token` locally,
        # then `gh secret set CLAUDE_CODE_OAUTH_TOKEN`.
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Send weekly advisor email
        env:
          # data sources (same secrets the snapshot workflow uses)
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          OAUTH_CLIENT_JSON: ${{ secrets.OAUTH_CLIENT_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUB_CLEARER_THINKING: ${{ secrets.BEEHIIV_PUB_CLEARER_THINKING }}
          # needed by fetch_snapshot.py (dashboard refresh before send)
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          # advisor narrative: headless Claude Code on the subscription (see the install step)
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # decrypts advisor_memory/*.enc (conversation digests + durable memory)
          ADVISOR_MEMORY_KEY: ${{ secrets.ADVISOR_MEMORY_KEY }}
          ADVISOR_MODEL: ${{ secrets.ADVISOR_MODEL }}
          # email transport
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ADVISOR_EMAIL_TO: ${{ secrets.ADVISOR_EMAIL_TO }}
          # optional Slack fallback when email transport is down
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_DEFAULT_CHANNEL: ${{ secrets.SLACK_DEFAULT_CHANNEL }}
          PREFLIGHT_CRON: "0 11 * * 3"
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          PREFLIGHT_INPUT: ${{ inputs.preflight }}
        # Exits non-zero when the letter was not written (or a preflight check failed), so the
        # run shows red and GitHub emails Igor instead of hiding it behind a green check.
        run: |
          if [ "$EVENT_SCHEDULE" = "$PREFLIGHT_CRON" ] || [ "$PREFLIGHT_INPUT" = "true" ]; then
            python weekly_advisor.py --preflight
          else
            python weekly_advisor.py
          fi
