name: Growth-advisor reply handler

on:
  schedule:
    - cron: "*/5 * * * *"  # check for replies every ~5 minutes
  workflow_dispatch:

# Usually stateless, but commits advisor_memory/durable.md.enc back to the repo when a reply contains
# something durable worth remembering (see advisor_reply.py's remember_this tool).
permissions:
  contents: write

concurrency:
  group: advisor-reply
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Claude Code CLI
        # Claude writes through headless Claude Code on Igor's subscription (no Anthropic API
        # credits). Needs the CLAUDE_CODE_OAUTH_TOKEN secret: `claude setup-token` locally,
        # then `gh secret set CLAUDE_CODE_OAUTH_TOKEN`.
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Answer any pending replies
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          OAUTH_CLIENT_JSON: ${{ secrets.OAUTH_CLIENT_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUB_CLEARER_THINKING: ${{ secrets.BEEHIIV_PUB_CLEARER_THINKING }}
          # answers run through headless Claude Code on the subscription (see the install step)
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # decrypts advisor_memory/*.enc (conversation digests + durable memory)
          ADVISOR_MEMORY_KEY: ${{ secrets.ADVISOR_MEMORY_KEY }}
          ADVISOR_MODEL: ${{ secrets.ADVISOR_MODEL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
        run: python advisor_reply.py
