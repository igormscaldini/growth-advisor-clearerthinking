name: Accountability partner intros

# Overcoming Procrastination workshop: match on the evening of Nov 30 (US Eastern), send the intros on Dec 1 from
# 9am ET. All logic, rules and safety checks: accountability_pairs.py. GitHub throttles schedule events on this repo
# (a few runs a day whatever the cron says), so each step is scheduled hourly over a window; both steps are
# idempotent (matching skips once the to-send tab exists, sending skips rows with "Sent at"), and the send step
# matches first if the matching runs never fired.
# To stop everything: gh workflow disable accountability-pairs.yml. Delete this file after the Dec 1 round.
on:
  schedule:
    - cron: "0 0-5 1 12 *"    # match: Nov 30, 7pm to midnight ET
    - cron: "0 14-23 1 12 *"  # send: Dec 1, 9am to 6pm ET
  workflow_dispatch:
    inputs:
      step:
        description: "match, send, or test (preview tab + one sample email to your +qa address)"
        type: choice
        options: [test, match, send]
        default: test
      force:
        description: "match: rebuild the to-send tab even if it exists"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: accountability-pairs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Claude Code CLI
        # Pairs new sign-ups by reading their projects; headless Claude Code on Igor's subscription.
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run
        # PUBLIC logs: accountability_pairs.py prints counts only. Never echo an address or a project here.
        env:
          ACCOUNTABILITY_SHEET_ID: ${{ secrets.ACCOUNTABILITY_SHEET_ID }}
          GUIDED_TRACK_USERNAME: ${{ secrets.GUIDED_TRACK_USERNAME }}
          GUIDED_TRACK_PASSWORD: ${{ secrets.GUIDED_TRACK_PASSWORD }}
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUB_CLEARER_THINKING: ${{ secrets.BEEHIIV_PUB_CLEARER_THINKING }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          OAUTH_CLIENT_JSON: ${{ secrets.OAUTH_CLIENT_JSON }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ADVISOR_MODEL: ${{ secrets.ADVISOR_MODEL }}
          STEP: ${{ github.event_name == 'workflow_dispatch' && inputs.step || (github.event.schedule == '0 0-5 1 12 *' && 'match' || 'send') }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '--force' || '' }}
        run: |
          if [ "$STEP" = "test" ]; then
            python accountability_pairs.py test --to igormscaldini+qa@gmail.com
          else
            python accountability_pairs.py "$STEP" $FORCE
          fi
