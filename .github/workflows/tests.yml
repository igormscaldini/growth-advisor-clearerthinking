name: Unit tests

on:
  push:
    branches: [main]
    paths: ["**.py", "tests/**", "requirements.txt", "pytest.ini", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      # statsmodels (seo_experiment_analysis.py) and markdown (reports/md_report.py) are only
      # needed by those modules and their tests; without either, the whole run dies at collection
      # (red from 2026-09-19 to 2026-10-02 for statsmodels, and from 2026-11-06 for markdown).
      - run: pip install -r requirements.txt pytest statsmodels markdown
      - run: pytest -q
