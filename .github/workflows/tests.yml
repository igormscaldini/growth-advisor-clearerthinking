name: Unit tests

on:
  push:
    branches: [main]
    paths: ["**.py", "tests/**", "requirements.txt", "pytest.ini", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      # statsmodels is only needed by seo_experiment_analysis.py and its tests; without it the
      # whole run died at collection (every push was red from 2026-09-19 to 2026-10-02).
      - run: pip install -r requirements.txt pytest statsmodels
      - run: pytest -q
